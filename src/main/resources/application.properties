spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/leets_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
jwt.secret=change-this-demo-secret-key-change-this-demo-secret-key-1234567890
jwt.access-token-expiration-minutes=30
jwt.refresh-token-expiration-days=14
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/auth/kakao/callback}
