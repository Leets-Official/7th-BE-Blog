spring:

  application:
    name: demo


  oauth2:
    kakao:
      client-id: "${KAKAO_ID}"
      client-secret: "${KAKAO_SECRET}"
      redirect-uri: "http://${PORT}:8080/api/auth/code/kakao"
      authorization-uri: "https://kauth.kakao.com/oauth/authorize"
      token-uri: "https://kauth.kakao.com/oauth/token"
      user-info-uri: "https://kapi.kakao.com/v2/user/me"




  #redis 포트 번호 지정
  data:
    redis:
      host: ${PORT}
      port: 6379


  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${PORT}:3306
    username: root
    password: ${MY_SQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  # 구글 SMTP
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_SMTP}
    password: ${MAIL_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


#swagger yaml 경로 설정
springdoc:
  swagger-ui:
    url: /restDocs/openapi3.yaml



jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000


