spring:
  application:
    name: 7th-BE-Blog

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
jwt:
  secret: ${JWT_SECRET}
  accessTokenExpirationSeconds: 900
  refreshTokenExpirationSeconds: 1209600
  accessCookieName: ACCESS_TOKEN
  refreshCookieName: REFRESH_TOKEN
  secure: false
  httpOnly: true
  sameSite: Lax
