name: CI/CD

on:
  pull_request:
    branches:
      - main
      - "김동빈/main"
      - "김동빈/8주차"
  push:
    branches:
      - main
      - "김동빈/main"
      - "김동빈/8주차"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 7th-be-blog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew clean test

      - name: Build
        run: ./gradlew bootJar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: 7th-be-blog/build/libs/*.jar

  cd:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: 7th-be-blog/build/libs

      - name: Create application.yml
        run: |
          cat > 7th-be-blog/application.yml <<'EOF'
          ${{ secrets.APPLICATION_YML }}
          EOF

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy/build/libs
          cp 7th-be-blog/Dockerfile deploy/Dockerfile
          cp 7th-be-blog/docker-compose.yml deploy/docker-compose.yml
          cp 7th-be-blog/application.yml deploy/application.yml
          cp 7th-be-blog/build/libs/*.jar deploy/build/libs/app.jar

      - name: Copy project files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/**"
          target: /home/${{ secrets.EC2_USERNAME }}/7th-BE-Blog/7th-be-blog
          strip_components: 1
          rm: true
          command_timeout: 10m

      - name: Run Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/7th-BE-Blog/7th-be-blog
            docker compose down
            docker compose up -d --build
