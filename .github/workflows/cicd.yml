name: CI/CD

on:
  push:
    branches:햣
      - "이은표/8주차"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: eunphyo/week2
        run: chmod +x gradlew

      - name: Build application
        working-directory: eunphyo/week2
        run: ./gradlew clean bootJar

      - name: Prepare deploy files
        run: |
          mkdir -p deploy
          JAR_FILE=$(find eunphyo/week2/build/libs -maxdepth 1 -name '*.jar' ! -name '*plain.jar' | head -n 1)
          cp "$JAR_FILE" deploy/app.jar
          cp eunphyo/week2/Dockerfile deploy/Dockerfile
          cp eunphyo/week2/docker-compose.yml deploy/docker-compose.yml

      - name: Copy deploy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/Dockerfile,deploy/docker-compose.yml,deploy/app.jar"
          target: "~/week2"
          strip_components: 1

      - name: Run docker compose on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/week2

            cat > ~/week2/application.yml <<'EOF'
            ${{ secrets.APPLICATION_YML }}
            EOF

            cat > ~/week2/.env <<'EOF'
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            EOF

            cd ~/week2

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update
                sudo apt-get install -y docker-compose-plugin
              elif command -v yum >/dev/null 2>&1; then
                sudo yum install -y docker-compose-plugin || sudo yum install -y docker-compose
              fi

              if docker compose version >/dev/null 2>&1; then
                COMPOSE="docker compose"
              elif command -v docker-compose >/dev/null 2>&1; then
                COMPOSE="docker-compose"
              else
                echo "Docker Compose is not installed."
                exit 1
              fi
            fi

            $COMPOSE down
            $COMPOSE up -d --build
