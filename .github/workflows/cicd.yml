name: CI/CD

on:
  pull_request:
    branches:
      - main
      - "김동빈/main"
      - "김동빈/8주차"
  push:
    branches:
      - main
      - "김동빈/main"
      - "김동빈/8주차"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 7th-be-blog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Test
        run: ./gradlew clean test

      - name: Build
        run: ./gradlew bootJar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: 7th-be-blog/build/libs/*.jar

  cd:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: 7th-be-blog/build/libs

      - name: Create application.yml
        run: |
          cat > 7th-be-blog/application.yml <<'EOF'
          ${{ secrets.APPLICATION_YML }}
          EOF

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy/build/libs
          cp 7th-be-blog/Dockerfile deploy/Dockerfile
          cp 7th-be-blog/docker-compose.yml deploy/docker-compose.yml
          cp 7th-be-blog/application.yml deploy/application.yml
          cp 7th-be-blog/build/libs/*.jar deploy/build/libs/app.jar

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy project files to EC2
        run: |
          tar -czf deploy.tar.gz -C deploy .
          timeout 5m ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "rm -rf ~/7th-BE-Blog/7th-be-blog && mkdir -p ~/7th-BE-Blog/7th-be-blog"
          timeout 5m scp -i ~/.ssh/ec2_key -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            deploy.tar.gz "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/7th-BE-Blog/deploy.tar.gz"
          timeout 5m ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "tar -xzf ~/7th-BE-Blog/deploy.tar.gz -C ~/7th-BE-Blog/7th-be-blog && rm ~/7th-BE-Blog/deploy.tar.gz"

      - name: Run Docker Compose on EC2
        run: |
          timeout 10m ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" <<'EOF'
          set -e
          cd ~/7th-BE-Blog/7th-be-blog
          docker compose down
          docker compose up -d --build
          EOF
