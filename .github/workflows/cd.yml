name: Leets CD

on:
  push:
    branches: ["나명준/main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'Corretto'
          cache: 'gradle'

      - name: gradlew test and build
        run: ./gradlew clean build

      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: docker build and push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/leets-test:latest .
          docker push ${{secrets.DOCKER_USERNAME }}/leets-test:latest

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST}}
          username: ${{ secrets.EC2_USERNAME}}
          key: ${{ secrets.EC2_KEY}}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.EC2_USERNAME }}/app"
          


      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST}}
          username: ${{ secrets.EC2_USERNAME}}
          key: ${{ secrets.EC2_KEY}}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/app
            
            echo "${{ secrets.ENV_FILE }}" > .env
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/leets-test:latest
            sudo docker compose down
            sudo docker compose up -d



