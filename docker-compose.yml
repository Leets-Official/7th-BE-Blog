
services:

  mysql:
    image: mysql:8.0
    container_name: blog-mysql

    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: blog

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  spring:
    build: .

    container_name: blog-server

    restart: always

    ports:
      - "8080:8080"

    depends_on:
      - mysql

volumes:
  mysql-data:
