version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container

    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: mydb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypass

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - app-network

  spring:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: spring-container

    ports:
      - "8080:8080"

    depends_on:
      - mysql

    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network: