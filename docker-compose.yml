version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: my-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD : ${MY_SQL_PASSWORD}
      MYSQL_DATABASE: mydatabase
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin", "ping", "-h" ,"127.0.0.1", "-u", "root" ,"-p${MY_SQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis
    container_name: my-redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD-SHELL","redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    image: nanajun/leets-test:latest
    container_name: my-spring
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/mydatabase?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF=8
      SPRING_DATASOURCE_USERNAME: root
    restart: always

volumes:
  mysql_data: